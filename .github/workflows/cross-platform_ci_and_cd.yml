name: Cross-Platform CI/CD

# -----------------------------------------------------------------------------
# RUNNER TRIGGER LOGIC:
# This workflow is explicitly configured to ONLY trigger on tag pushes (e.g., v1.0.6).
# Standard pushes to the 'main' branch or pull requests will NOT wake up the runners,
# ensuring we don't waste CI compilation minutes on routine development tasks.
# -----------------------------------------------------------------------------
on:
  push:
    tags:
      - "v*" # <-- This specific rule restricts execution to version tags only

env:
  CARGO_TERM_COLOR: always
  # Force all JavaScript actions to use Node 24 immediately to silence deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Need to grant write permissions for the Release step to move compiled binaries into Release
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # Use windows-latest to allow GitHub's internal redirection to handle the label update
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose

      # Explicitly naming artifacts distinctly per-OS
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: clump-${{ matrix.os }}
          path: |
            target/release/clump
            target/release/clump.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v6

      - name: Create release directory structure
        run: |
          mkdir -p ${{ github.workspace }}/incoming
          mkdir -p ${{ github.workspace }}/release-files

      # Download each artifact explicitly into its own deliberate folder to avoid v4 flattening bugs
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: clump-ubuntu-latest
          path: ${{ github.workspace }}/incoming/ubuntu

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: clump-macos-latest
          path: ${{ github.workspace }}/incoming/macos

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: clump-windows-latest
          path: ${{ github.workspace }}/incoming/windows

      - name: Package artifacts for release
        run: |
          cd ${{ github.workspace }}/incoming

          # Package Linux binary
          if [ -f "ubuntu/clump" ]; then
            tar -czf ${{ github.workspace }}/release-files/clump-linux.tar.gz -C ubuntu clump
          fi

          # Package macOS binary
          if [ -f "macos/clump" ]; then
            tar -czf ${{ github.workspace }}/release-files/clump-macos.tar.gz -C macos clump
          fi

          # Package Windows binary
          if [ -f "windows/clump.exe" ]; then
            zip -j ${{ github.workspace }}/release-files/clump-windows.zip windows/clump.exe
          fi

          # Generate checksums
          cd ${{ github.workspace }}/release-files
          sha256sum * > checksums.txt

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
